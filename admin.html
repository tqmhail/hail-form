<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الطلبات — الإدارة العامة للتعليم بمنطقة حائل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--teal:#0f6e6e;--teal-d:#0a5252;--teal-t:#e6f2f2;--ink:#1f2d2d;--muted:#6b7b7b;--line:#d5dede;--bg:#eef3f3;--ok:#1a7f5a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);padding:20px}
  .wrap{max-width:1200px;margin:0 auto}
  .head{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:18px}
  .head h1{font-size:20px;font-weight:900}
  .head p{opacity:.9;font-size:14px;margin-top:6px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .count{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:700;color:var(--teal-d)}
  .spacer{flex:1}
  .btn{border:0;font-family:inherit;font-weight:700;font-size:14px;padding:11px 20px;border-radius:10px;cursor:pointer}
  .btn-x{background:var(--ok);color:#fff}
  .btn-c{background:var(--teal);color:#fff}
  .btn:hover{opacity:.9}
  .search{flex:1;min-width:200px;font-family:inherit;font-size:14px;padding:11px 14px;border:1.6px solid var(--line);border-radius:10px;text-align:right}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh}
  table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}
  th{background:var(--teal);color:#fff;position:sticky;top:0;font-weight:700;font-size:12.5px}
  tr:hover td{background:#f7fbfb}
  td a{color:var(--teal-d)}
  .state{padding:60px 20px;text-align:center;color:var(--muted)}
  .err{background:#fdf3f2;border:1px solid #f0c9c4;color:#a5342a;border-radius:10px;padding:16px;text-align:center}
  .err a{color:var(--teal-d);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>لوحة الطلبات — التسجيل المبدئي لإعادة إصدار الشهادة</h1>
    <p>الإدارة العامة للتعليم بمنطقة حائل · صفحة محمية</p>
  </div>

  <div id="content">
    <div class="state" id="loading">جارٍ تحميل الطلبات…</div>
  </div>
</div>

<script>
  var DATA = [];
  var COLS = [
    ["requestNo","رقم الطلب"],["submittedAt","وقت التقديم"],["fullName","الاسم الرباعي"],
    ["nationalId","رقم الهوية"],["mobile","رقم الجوال"],["relativeMobile","جوال القريب"],
    ["email","البريد"],["gender","الجنس"],["residence","مقر السكن"],
    ["eduDept","إدارة التعليم"],["gradYear","عام التخرج"],["major","التخصص"],
    ["requestType","نوع الطلب"],["documents","المستندات"]
  ];

  function fmtDate(iso){ if(!iso) return ""; try{var d=new Date(iso); return d.toLocaleString('ar-SA');}catch(e){return iso;} }

  fetch('/api/admin-list')
    .then(function(r){
      if(r.status===401){ throw {auth:true}; }
      return r.json();
    })
    .then(function(res){
      if(!res.ok){ showError(res.error||'تعذّر تحميل البيانات.'); return; }
      DATA = res.rows||[];
      render();
    })
    .catch(function(err){
      if(err && err.auth){
        document.getElementById('content').innerHTML =
          '<div class="err">يجب تسجيل الدخول أولاً.<br><br>'+
          '<a href="/.auth/login/aad?post_login_redirect_uri=/admin.html">تسجيل الدخول بحساب Microsoft</a></div>';
      } else {
        showError('خطأ في الاتصال بالخادم.');
      }
    });

  function showError(msg){
    document.getElementById('content').innerHTML='<div class="err">'+msg+'</div>';
  }

  function render(){
    var html =
      '<div class="bar">'+
        '<div class="count">إجمالي الطلبات: '+DATA.length+'</div>'+
        '<input class="search" id="search" placeholder="بحث بالاسم أو الهوية أو الجوال…">'+
        '<div class="spacer"></div>'+
        '<button class="btn btn-x" onclick="exportXlsx()">⬇ تصدير Excel</button>'+
        '<button class="btn btn-c" onclick="exportCsv()">⬇ تصدير CSV</button>'+
        '<a class="btn" style="background:#eee;color:#333;text-decoration:none" href="/.auth/logout">خروج</a>'+
      '</div>'+
      '<div class="card"><table id="tbl"><thead><tr>'+
        COLS.map(function(c){return '<th>'+c[1]+'</th>';}).join('')+
      '</tr></thead><tbody id="tbody"></tbody></table></div>';
    document.getElementById('content').innerHTML=html;
    document.getElementById('search').addEventListener('input',function(){drawRows(this.value.trim());});
    drawRows('');
  }

  function drawRows(q){
    var tb=document.getElementById('tbody');
    var rows = DATA.filter(function(r){
      if(!q) return true;
      return (r.fullName+' '+r.nationalId+' '+r.mobile).indexOf(q)>-1;
    });
    tb.innerHTML = rows.map(function(r){
      return '<tr>'+COLS.map(function(c){
        var v=r[c[0]]||'';
        if(c[0]==='submittedAt') v=fmtDate(v);
        if(c[0]==='documents' && v){
          var links=v.split('\n').filter(Boolean);
          return '<td>'+links.map(function(u,i){return '<a href="'+u+'" target="_blank">مستند'+(i+1)+'</a>';}).join(' · ')+'</td>';
        }
        return '<td>'+String(v).replace(/</g,'&lt;')+'</td>';
      }).join('')+'</tr>';
    }).join('');
    if(!rows.length) tb.innerHTML='<tr><td colspan="'+COLS.length+'" style="text-align:center;color:#6b7b7b;padding:30px">لا توجد نتائج</td></tr>';
  }

  function tableData(){
    return DATA.map(function(r){
      var o={};
      COLS.forEach(function(c){ o[c[1]] = c[0]==='submittedAt'? fmtDate(r[c[0]]) : (r[c[0]]||''); });
      return o;
    });
  }

  function exportXlsx(){
    var ws = XLSX.utils.json_to_sheet(tableData());
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "الطلبات");
    XLSX.writeFile(wb, "طلبات_الشهادة_"+stamp()+".xlsx");
  }

  function exportCsv(){
    var rows=tableData();
    var headers=COLS.map(function(c){return c[1];});
    var csv='\uFEFF'+headers.join(',')+'\n'+rows.map(function(r){
      return headers.map(function(h){
        var v=String(r[h]==null?'':r[h]).replace(/"/g,'""');
        return '"'+v+'"';
      }).join(',');
    }).join('\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="طلبات_الشهادة_"+stamp()+".csv";
    a.click();
  }

  function stamp(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
</script>
</body>
</html>
